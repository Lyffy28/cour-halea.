<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cour-halea - Leçons & Révisions</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #1e1e2e;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
        }

        header {
            width: 100%;
            max-width: 960px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #3d3f58;
            gap: 10px;
            flex-wrap: wrap;
        }

        .nav-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .back-btn {
            background-color: #2b2c40;
            color: #c8d6e5;
            border: 1px solid #484b6a;
            padding: 8px 14px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            transition: 0.2s;
        }

        .back-btn:hover {
            border-color: #00d2d3;
            color: #00d2d3;
        }

        .lessons-btn {
            background-color: #ff9f43;
            color: #1e1e2e;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
        }

        .lessons-btn:hover {
            background-color: #feca57;
        }

        h1 {
            color: #00d2d3;
            font-size: 22px;
            text-align: center;
        }

        .container {
            width: 100%;
            max-width: 960px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
            header {
                flex-direction: column;
                align-items: stretch;
            }
            .nav-group {
                justify-content: space-between;
            }
        }

        .card {
            background-color: #26273b;
            border: 1px solid #3d3f58;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .card h2 {
            font-size: 17px;
            color: #ff9f43;
            border-bottom: 1px solid #3d3f58;
            padding-bottom: 8px;
        }

        .upload-area {
            border: 2px dashed #484b6a;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .upload-area:hover {
            border-color: #00d2d3;
        }

        .preview-img {
            max-width: 100%;
            max-height: 200px;
            border-radius: 8px;
            display: none;
            margin: 10px auto 0 auto;
            object-fit: contain;
        }

        textarea {
            width: 100%;
            height: 90px;
            background-color: #1e1e2e;
            border: 1px solid #484b6a;
            border-radius: 8px;
            padding: 10px;
            color: #ffffff;
            font-size: 13px;
            outline: none;
            resize: none;
        }

        textarea:focus {
            border-color: #00d2d3;
        }

        .btn-action {
            background-color: #00d2d3;
            color: #1e1e2e;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            width: 100%;
        }

        .btn-action:hover {
            background-color: #01a3a4;
        }

        .btn-action:disabled {
            background-color: #484b6a;
            cursor: not-allowed;
            color: #a4b0be;
        }

        .btn-save {
            background-color: #1dd1a1;
            color: #1e1e2e;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            width: 100%;
            display: none;
        }

        .btn-save:hover {
            background-color: #10ac84;
        }

        #fiche-resultat {
            background-color: #1e1e2e;
            border: 1px solid #3d3f58;
            border-radius: 8px;
            padding: 15px;
            min-height: 230px;
            max-height: 380px;
            overflow-y: auto;
            white-space: pre-wrap;
            line-height: 1.5;
            font-size: 14px;
            color: #c8d6e5;
        }

        /* Section Masquée par défaut : accessible UNIQUEMENT via le bouton */
        .saved-section {
            display: none;
            width: 100%;
            max-width: 960px;
            margin-top: 25px;
            background-color: #26273b;
            border: 2px solid #ff9f43;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
        }

        .saved-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #3d3f58;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .saved-title {
            color: #ff9f43;
            font-size: 18px;
            font-weight: bold;
        }

        .badge-count {
            background-color: #1e1e2e;
            color: #00d2d3;
            border: 1px solid #00d2d3;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }

        .fiche-item {
            background-color: #1e1e2e;
            border: 1px solid #484b6a;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .fiche-item-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .fiche-titre {
            color: #ff9f43;
            font-weight: bold;
            font-size: 15px;
        }

        .fiche-date {
            color: #a4b0be;
            font-size: 12px;
            margin-left: 8px;
        }

        .delete-btn {
            background-color: #ee5253;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 12px;
            cursor: pointer;
            transition: 0.2s;
        }

        .delete-btn:hover {
            background-color: #c0392b;
        }

        .fiche-content-saved {
            font-size: 14px;
            color: #c8d6e5;
            white-space: pre-wrap;
            line-height: 1.5;
            border-top: 1px solid #2d2f44;
            padding-top: 10px;
        }

        .empty-msg {
            color: #a4b0be;
            font-size: 14px;
            text-align: center;
            padding: 20px 0;
        }
    </style>
</head>
<body>

    <header>
        <div class="nav-group">
            <a href="accueil.html" class="back-btn">← Accueil</a>
            <!-- Le SEUL bouton pour ouvrir ou cacher tes leçons enregistrées -->
            <button class="lessons-btn" onclick="toggleAffichageLecons()">
                📖 Mes leçons (<span id="nb-lecons-btn">0</span>) ▾
            </button>
        </div>
        <h1 id="titre-matiere">Matière</h1>
    </header>

    <div class="container">
        <!-- 1. Formulaire pour prendre la photo directement -->
        <div class="card">
            <h2>1. Prendre une photo du cours</h2>
            
            <label class="upload-area" for="photo-input">
                <p id="label-upload">📷 Clique ici pour prendre ou charger la photo</p>
                <img id="image-preview" class="preview-img" alt="Aperçu">
            </label>
            <input type="file" id="photo-input" accept="image/*" capture="environment" style="display:none;" onchange="afficherApercu(event)">

            <p style="font-size: 12px; color: #a4b0be; text-align: center;">- OU ajoute des précisions textuelles -</p>
            <textarea id="cours-texte" placeholder="Écris du vocabulaire, des phrases ou des règles en plus..."></textarea>

            <button class="btn-action" id="btn-generer" onclick="genererFiche()">⚡ Créer la fiche de révision</button>
        </div>

        <!-- 2. Fiche créée par l'IA + Bouton d'enregistrement -->
        <div class="card">
            <h2>2. Fiche de révision par l'IA</h2>
            <div id="fiche-resultat">Prends ta photo à gauche puis clique sur "Créer la fiche de révision".</div>

            <button class="btn-save" id="btn-save" onclick="sauvegarderFiche()">
                💾 Enregistrer la leçon dans <span id="label-save-matiere"></span>
            </button>
            <p id="save-confirmation" style="color: #1dd1a1; font-weight: bold; font-size: 13px; text-align: center;"></p>
        </div>
    </div>

    <!-- 3. Section des leçons : VISIBLE UNIQUEMENT après clic sur "Mes leçons" -->
    <div class="saved-section" id="section-lecons">
        <div class="saved-header">
            <span class="saved-title" id="saved-title">📚 Leçons enregistrées</span>
            <span class="badge-count" id="badge-total">0 leçon</span>
        </div>
        <div id="liste-fiches"></div>
    </div>

    <script>
        const CLE_API = "AQ.Ab8RN6JOyUF9wbanLDRGcIzzXnUpMzrLLYk75TLBPPHskY2VHg";

        // Détection stricte de la matière (Espagnol, Anglais, Maths, etc.)
        const params = new URLSearchParams(window.location.search);
        const matiereActuelle = params.get("matiere") || "Général";
        const cleStockage = "fiches_" + matiereActuelle;

        document.getElementById("titre-matiere").textContent = "Matière : " + matiereActuelle;
        document.getElementById("saved-title").textContent = "📚 Leçons enregistrées en " + matiereActuelle;
        document.getElementById("label-save-matiere").textContent = matiereActuelle;

        let base64Image = null;
        let mimeTypeImage = null;
        let dernierTexteFiche = "";

        // Afficher ou cacher la zone des leçons
        function toggleAffichageLecons() {
            const section = document.getElementById("section-lecons");
            if (section.style.display === "block") {
                section.style.display = "none";
            } else {
                section.style.display = "block";
                section.scrollIntoView({ behavior: "smooth" });
            }
        }

        // Aperçu de la photo
        function afficherApercu(event) {
            const file = event.target.files[0];
            if (!file) return;

            mimeTypeImage = file.type;
            const reader = new FileReader();

            reader.onload = function(e) {
                const img = document.getElementById("image-preview");
                img.src = e.target.result;
                img.style.display = "block";
                document.getElementById("label-upload").style.display = "none";
                base64Image = e.target.result.split(",")[1];
            };

            reader.readAsDataURL(file);
        }

        // Création de la fiche par l'IA
        async function genererFiche() {
            const texteSaisi = document.getElementById("cours-texte").value.trim();
            if (!base64Image && texteSaisi === "") {
                alert("Ajoute une photo ou écris du texte de cours !");
                return;
            }

            const resDiv = document.getElementById("fiche-resultat");
            const btnGen = document.getElementById("btn-generer");
            const btnSave = document.getElementById("btn-save");

            btnGen.disabled = true;
            btnSave.style.display = "none";
            resDiv.textContent = "⏳ L'IA analyse ton cours et génère la fiche...";
            document.getElementById("save-confirmation").textContent = "";

            try {
                const prompt = `Tu es un professeur tuteur expert en : ${matiereActuelle}.
À partir du document fourni (photo ou notes), génère une fiche de révision complète et facile à mémoriser :
1. Titre clair du cours
2. Notions essentielles & vocabulaire ou règles clés
3. Points indispensables à retenir par cœur
4. 3 questions / réponses rapides pour réviser.
Notes supplémentaires : ${texteSaisi}`;

                let parts = [{ text: prompt }];

                if (base64Image) {
                    parts.push({
                        inline_data: {
                            mime_type: mimeTypeImage || "image/jpeg",
                            data: base64Image
                        }
                    });
                }

                const response = await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "x-goog-api-key": CLE_API
                    },
                    body: JSON.stringify({ contents: [{ parts: parts }] })
                });

                const data = await response.json();

                if (data.candidates && data.candidates[0].content && data.candidates[0].content.parts[0].text) {
                    dernierTexteFiche = data.candidates[0].content.parts[0].text;
                    resDiv.textContent = dernierTexteFiche;
                    btnSave.style.display = "block";
                } else if (data.error) {
                    resDiv.textContent = "Erreur : " + data.error.message;
                } else {
                    resDiv.textContent = "Impossible de lire le document.";
                }
            } catch (err) {
                resDiv.textContent = "Erreur de connexion. Vérifie ton réseau internet.";
            } finally {
                btnGen.disabled = false;
            }
        }

        // Enregistrement STRICT dans la matière courante
        function sauvegarderFiche() {
            if (!dernierTexteFiche) return;

            const existantes = JSON.parse(localStorage.getItem(cleStockage) || "[]");
            const date = new Date().toLocaleDateString("fr-FR");

            const premierLigne = dernierTexteFiche.split("\n")[0].replace(/[#*]/g, "").trim();
            const titre = premierLigne.length > 3 ? premierLigne : ("Leçon du " + date);

            existantes.unshift({
                titre: titre,
                date: date,
                contenu: dernierTexteFiche
            });

            localStorage.setItem(cleStockage, JSON.stringify(existantes));
            document.getElementById("save-confirmation").textContent = `✅ Leçon sauvegardée dans ${matiereActuelle} !`;
            document.getElementById("btn-save").style.display = "none";
            
            // Mise à jour du compteur et de la liste
            mettreAJourCompteurEtListe();
        }

        // Rafraîchir les données de la matière courante
        function mettreAJourCompteurEtListe() {
            const existantes = JSON.parse(localStorage.getItem(cleStockage) || "[]");
            const box = document.getElementById("liste-fiches");
            const countBtn = document.getElementById("nb-lecons-btn");
            const badgeTotal = document.getElementById("badge-total");

            countBtn.textContent = existantes.length;
            badgeTotal.textContent = existantes.length + (existantes.length > 1 ? " leçons" : " leçon");

            if (existantes.length === 0) {
                box.innerHTML = `<div class="empty-msg">Aucune leçon enregistrée en ${matiereActuelle}.</div>`;
                return;
            }

            box.innerHTML = "";
            existantes.forEach((fiche, index) => {
                const item = document.createElement("div");
                item.className = "fiche-item";
                item.innerHTML = `
                    <div class="fiche-item-top">
                        <div>
                            <span class="fiche-titre">📌 ${fiche.titre}</span>
                            <span class="fiche-date">(${fiche.date})</span>
                        </div>
                        <button class="delete-btn" onclick="supprimerFiche(${index})">Supprimer</button>
                    </div>
                    <div class="fiche-content-saved">${fiche.contenu}</div>
                `;
                box.appendChild(item);
            });
        }

        function supprimerFiche(index) {
            let existantes = JSON.parse(localStorage.getItem(cleStockage) || "[]");
            existantes.splice(index, 1);
            localStorage.setItem(cleStockage, JSON.stringify(existantes));
            mettreAJourCompteurEtListe();
        }

        // Initialiser le compteur sans afficher la liste au démarrage
        mettreAJourCompteurEtListe();
    </script>

</body>
</html>
