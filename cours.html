<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cour-halea - Fiches de cours</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #1e1e2e;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        header {
            width: 100%;
            max-width: 960px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid #3d3f58;
        }

        .back-btn {
            background-color: #2b2c40;
            color: #c8d6e5;
            border: 1px solid #484b6a;
            padding: 8px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.2s;
        }

        .back-btn:hover {
            border-color: #00d2d3;
            color: #00d2d3;
        }

        h1 {
            color: #00d2d3;
            font-size: 24px;
        }

        .container {
            width: 100%;
            max-width: 960px;
            display: grid;
            grid-template-columns: 1fr 1.1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background-color: #26273b;
            border: 1px solid #3d3f58;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .card h2 {
            font-size: 18px;
            color: #ff9f43;
            border-bottom: 1px solid #3d3f58;
            padding-bottom: 8px;
        }

        .upload-area {
            border: 2px dashed #484b6a;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .upload-area:hover {
            border-color: #00d2d3;
        }

        .preview-img {
            max-width: 100%;
            max-height: 200px;
            border-radius: 8px;
            display: none;
            margin: 10px auto 0 auto;
            object-fit: contain;
        }

        textarea {
            width: 100%;
            height: 90px;
            background-color: #1e1e2e;
            border: 1px solid #484b6a;
            border-radius: 8px;
            padding: 10px;
            color: #ffffff;
            font-size: 13px;
            outline: none;
            resize: none;
        }

        textarea:focus {
            border-color: #00d2d3;
        }

        .btn-action {
            background-color: #00d2d3;
            color: #1e1e2e;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            width: 100%;
        }

        .btn-action:hover {
            background-color: #01a3a4;
        }

        .btn-action:disabled {
            background-color: #484b6a;
            cursor: not-allowed;
            color: #a4b0be;
        }

        .btn-save {
            background-color: #1dd1a1;
            color: #1e1e2e;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            display: none;
            width: 100%;
        }

        .btn-save:hover {
            background-color: #10ac84;
        }

        #fiche-resultat {
            background-color: #1e1e2e;
            border: 1px solid #3d3f58;
            border-radius: 8px;
            padding: 15px;
            min-height: 250px;
            max-height: 380px;
            overflow-y: auto;
            white-space: pre-wrap;
            line-height: 1.5;
            font-size: 14px;
            color: #c8d6e5;
        }

        /* Section des fiches enregistrées */
        .saved-section {
            width: 100%;
            max-width: 960px;
            margin-top: 30px;
            background-color: #26273b;
            border: 1px solid #3d3f58;
            border-radius: 12px;
            padding: 20px;
        }

        .saved-section h2 {
            color: #00d2d3;
            font-size: 18px;
            margin-bottom: 15px;
            border-bottom: 1px solid #3d3f58;
            padding-bottom: 8px;
        }

        .fiche-item {
            background-color: #1e1e2e;
            border: 1px solid #484b6a;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 12px;
        }

        .fiche-header-saved {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .fiche-titre {
            color: #ff9f43;
            font-weight: bold;
            font-size: 15px;
        }

        .delete-btn {
            background-color: #ee5253;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
        }

        .fiche-content-saved {
            font-size: 13px;
            color: #c8d6e5;
            white-space: pre-wrap;
            line-height: 1.4;
            max-height: 150px;
            overflow-y: auto;
            border-top: 1px solid #2b2c40;
            padding-top: 8px;
        }

        .save-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        select {
            background-color: #1e1e2e;
            color: white;
            border: 1px solid #484b6a;
            padding: 10px;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <header>
        <a href="accueil.html" class="back-btn">← Accueil</a>
        <h1 id="titre-matiere">Matière</h1>
        <div></div>
    </header>

    <div class="container">
        <!-- 1. Envoi Photo / Texte -->
        <div class="card">
            <h2>1. Ajouter mon cours</h2>
            
            <label class="upload-area" for="photo-input">
                <p id="label-upload">📷 Prendre ou importer une photo du cours</p>
                <img id="image-preview" class="preview-img" alt="Aperçu">
            </label>
            <input type="file" id="photo-input" accept="image/*" capture="environment" style="display:none;" onchange="afficherApercu(event)">

            <p style="font-size: 13px; color: #a4b0be; text-align: center;">- OU tape / colle ton texte ici -</p>
            <textarea id="cours-texte" placeholder="Écris ici des notes ou du vocabulaire si tu n'as pas de photo..."></textarea>

            <button class="btn-action" id="btn-generer" onclick="genererFiche()">⚡ Créer la fiche de révision</button>
        </div>

        <!-- 2. Résultat + Enregistrement -->
        <div class="card">
            <h2>2. Fiche de révision par l'IA</h2>
            <div id="fiche-resultat">Prends une photo ou écris ton cours à gauche, puis clique sur "Créer la fiche de révision".</div>

            <!-- Options d'enregistrement -->
            <div class="save-controls" id="zone-sauvegarde" style="display:none;">
                <select id="select-matiere-save">
                    <option value="Anglais">🇬🇧 Anglais</option>
                    <option value="Espagnol">🇪🇸 Espagnol</option>
                    <option value="Français">🇫🇷 Français</option>
                    <option value="Latin-Grec">🏛️ Latin / Grec</option>
                    <option value="Science">🔬 Science</option>
                    <option value="Culture">🌍 Culture</option>
                </select>
                <button class="btn-save" id="btn-save" onclick="sauvegarderFiche()">💾 Enregistrer la fiche</button>
            </div>
            <p id="save-confirmation" style="color: #1dd1a1; font-weight: bold; font-size: 13px; text-align: center;"></p>
        </div>
    </div>

    <!-- 3. Fiches enregistrées -->
    <div class="saved-section">
        <h2 id="saved-title">📚 Fiches enregistrées dans cette matière</h2>
        <div id="liste-fiches">Aucune fiche enregistrée pour l'instant.</div>
    </div>

    <script>
        const CLE_API = "AQ.Ab8RN6JOyUF9wbanLDRGcIzzXnUpMzrLLYk75TLBPPHskY2VHg";

        // Détection de la matière
        const params = new URLSearchParams(window.location.search);
        let matiereActuelle = params.get("matiere") || "Général";
        document.getElementById("titre-matiere").textContent = "Révisions : " + matiereActuelle;
        document.getElementById("saved-title").textContent = "📚 Fiches enregistrées en " + matiereActuelle;
        
        // Sélectionne automatiquement la bonne matière dans le menu d'enregistrement
        const selectBox = document.getElementById("select-matiere-save");
        for (let opt of selectBox.options) {
            if (opt.value.toLowerCase() === matiereActuelle.toLowerCase()) {
                opt.selected = true;
            }
        }

        let base64Image = null;
        let mimeTypeImage = null;
        let dernierTexteFiche = "";

        // Aperçu photo
        function afficherApercu(event) {
            const file = event.target.files[0];
            if (!file) return;

            mimeTypeImage = file.type;
            const reader = new FileReader();

            reader.onload = function(e) {
                const img = document.getElementById("image-preview");
                img.src = e.target.result;
                img.style.display = "block";
                document.getElementById("label-upload").style.display = "none";
                base64Image = e.target.result.split(",")[1];
            };

            reader.readAsDataURL(file);
        }

        // Génération IA
        async function genererFiche() {
            const texteSaisi = document.getElementById("cours-texte").value.trim();
            if (!base64Image && texteSaisi === "") {
                alert("Merci d'ajouter une photo ou de saisir du texte de cours !");
                return;
            }

            const resDiv = document.getElementById("fiche-resultat");
            const btn = document.getElementById("btn-generer");
            btn.disabled = true;
            resDiv.textContent = "⏳ L'IA analyse ton cours et génère la fiche... Patiente un instant.";
            document.getElementById("zone-sauvegarde").style.display = "none";
            document.getElementById("save-confirmation").textContent = "";

            try {
                const prompt = `Tu es un tuteur scolaire spécialisé dans la matière : ${matiereActuelle}.
À partir de ce document (image ou texte), crée une fiche de révision super claire et structurée :
1. Titre du cours
2. Notions essentielles & Vocabulaire / Règles importantes
3. Points clés à retenir par cœur
4. 3 questions / réponses rapides d'entraînement.
Contenu texte additionnel fourni : ${texteSaisi}`;

                let parts = [{ text: prompt }];

                if (base64Image) {
                    parts.push({
                        inline_data: {
                            mime_type: mimeTypeImage || "image/jpeg",
                            data: base64Image
                        }
                    });
                }

                const response = await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "x-goog-api-key": CLE_API
                    },
                    body: JSON.stringify({ contents: [{ parts: parts }] })
                });

                const data = await response.json();

                if (data.candidates && data.candidates[0].content && data.candidates[0].content.parts[0].text) {
                    dernierTexteFiche = data.candidates[0].content.parts[0].text;
                    resDiv.textContent = dernierTexteFiche;
                    document.getElementById("zone-sauvegarde").style.display = "flex";
                    document.getElementById("btn-save").style.display = "block";
                } else if (data.error) {
                    resDiv.textContent = "Erreur : " + data.error.message;
                } else {
                    resDiv.textContent = "Impossible de générer la fiche.";
                }
            } catch (err) {
                resDiv.textContent = "Erreur de connexion. Vérifie ton réseau.";
            } finally {
                btn.disabled = false;
            }
        }

        // Sauvegarder dans la catégorie voulue (LocalStorage)
        function sauvegarderFiche() {
            if (!dernierTexteFiche) return;

            const matiereChoisie = document.getElementById("select-matiere-save").value;
            const cleStockage = "fiches_" + matiereChoisie;
            const existantes = JSON.parse(localStorage.getItem(cleStockage) || "[]");

            const date = new Date().toLocaleDateString("fr-FR");
            const premierLigne = dernierTexteFiche.split("\n")[0].replace(/[#*]/g, "").trim();
            const titre = premierLigne.length > 5 ? premierLigne : ("Fiche du " + date);

            existantes.push({
                titre: titre,
                date: date,
                contenu: dernierTexteFiche
            });

            localStorage.setItem(cleStockage, JSON.stringify(existantes));
            document.getElementById("save-confirmation").textContent = `✅ Fiche enregistrée en ${matiereChoisie} !`;

            if (matiereChoisie.toLowerCase() === matiereActuelle.toLowerCase()) {
                afficherFichesSauvegardees();
            }
        }

        // Afficher les fiches enregistrées pour la matière ouverte
        function afficherFichesSauvegardees() {
            const cleStockage = "fiches_" + matiereActuelle;
            const existantes = JSON.parse(localStorage.getItem(cleStockage) || "[]");
            const box = document.getElementById("liste-fiches");

            if (existantes.length === 0) {
                box.textContent = "Aucune fiche enregistrée pour l'instant.";
                return;
            }

            box.innerHTML = "";
            existantes.forEach((fiche, index) => {
                const item = document.createElement("div");
                item.className = "fiche-item";
                item.innerHTML = `
                    <div class="fiche-header-saved">
                        <span class="fiche-titre">📌 ${fiche.titre} (${fiche.date})</span>
                        <button class="delete-btn" onclick="supprimerFiche(${index})">Supprimer</button>
                    </div>
                    <div class="fiche-content-saved">${fiche.contenu}</div>
                `;
                box.appendChild(item);
            });
        }

        function supprimerFiche(index) {
            const cleStockage = "fiches_" + matiereActuelle;
            let existantes = JSON.parse(localStorage.getItem(cleStockage) || "[]");
            existantes.splice(index, 1);
            localStorage.setItem(cleStockage, JSON.stringify(existantes));
            afficherFichesSauvegardees();
        }

        // Chargement initial
        afficherFichesSauvegardees();
    </script>

</body>
</html>
