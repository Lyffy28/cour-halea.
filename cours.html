<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cour-halea - Espace Cours & Entraînement</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #1e1e2e;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding-bottom: 30px;
        }

        /* En-tête */
        header {
            background-color: #26273b;
            border-bottom: 1px solid #3d3f58;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-title {
            font-size: 18px;
            font-weight: bold;
            color: #00d2d3;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-back {
            background-color: #343650;
            color: #c8d6e5;
            border: 1px solid #484b6a;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            text-decoration: none;
            font-size: 13px;
            transition: 0.2s;
        }

        .btn-back:hover {
            background-color: #ee5253;
            color: white;
        }

        .container {
            max-width: 900px;
            width: 100%;
            margin: 20px auto;
            padding: 0 15px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Sélecteur de matière rapide */
        .matieres-bar {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 5px;
            -webkit-overflow-scrolling: touch;
        }

        .matiere-chip {
            background-color: #26273b;
            border: 1px solid #3d3f58;
            color: #c8d6e5;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            white-space: nowrap;
            cursor: pointer;
            transition: 0.2s;
        }

        .matiere-chip:hover, .matiere-chip.active {
            background-color: #00d2d3;
            color: #1e1e2e;
            border-color: #00d2d3;
        }

        /* Cartes */
        .card {
            background-color: #26273b;
            border: 1px solid #3d3f58;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .card h2 {
            font-size: 17px;
            color: #ff9f43;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Leçons Firebase */
        .lecons-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 250px;
            overflow-y: auto;
        }

        .lecon-item {
            background-color: #1e1e2e;
            border: 1px solid #3d3f58;
            border-radius: 8px;
            padding: 12px 15px;
            cursor: pointer;
            transition: 0.2s;
        }

        .lecon-item:hover {
            border-color: #00d2d3;
            transform: translateX(4px);
        }

        .lecon-item h4 {
            color: #00d2d3;
            font-size: 15px;
            margin-bottom: 4px;
        }

        .lecon-item p {
            color: #a4b0be;
            font-size: 13px;
            line-height: 1.4;
            white-space: pre-wrap;
        }

        /* Zone Générateur IA */
        .generator-inputs {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        .generator-inputs input {
            flex: 1;
            min-width: 220px;
            background-color: #1e1e2e;
            border: 1px solid #484b6a;
            color: #ffffff;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        .generator-inputs input:focus {
            border-color: #00d2d3;
        }

        .btn-gen {
            border: none;
            padding: 12px 18px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-exercice {
            background-color: #ff9f43;
            color: #1e1e2e;
        }

        .btn-quiz {
            background-color: #1dd1a1;
            color: #1e1e2e;
        }

        .btn-gen:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }

        .btn-gen:disabled {
            background-color: #484b6a;
            cursor: not-allowed;
            color: #a4b0be;
            transform: none;
        }

        /* Affichage Résultats IA */
        .ai-output-box {
            display: none;
            background-color: #1e1e2e;
            border: 1px solid #3d3f58;
            border-radius: 10px;
            padding: 18px;
            margin-top: 15px;
            line-height: 1.6;
            font-size: 14px;
            white-space: pre-wrap;
        }

        /* Quiz interactif */
        .quiz-container {
            display: none;
            flex-direction: column;
            gap: 15px;
            margin-top: 15px;
        }

        .quiz-card {
            background-color: #1e1e2e;
            border: 1px solid #3d3f58;
            border-radius: 10px;
            padding: 15px;
        }

        .quiz-question {
            font-size: 15px;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 12px;
        }

        .quiz-options {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .quiz-option {
            background-color: #26273b;
            border: 1px solid #484b6a;
            color: #c8d6e5;
            padding: 10px 14px;
            border-radius: 6px;
            cursor: pointer;
            text-align: left;
            font-size: 13px;
            transition: 0.2s;
        }

        .quiz-option:hover {
            background-color: #343650;
            border-color: #00d2d3;
        }

        .quiz-option.correct {
            background-color: rgba(29, 209, 161, 0.25) !important;
            border-color: #1dd1a1 !important;
            color: #1dd1a1 !important;
            font-weight: bold;
        }

        .quiz-option.wrong {
            background-color: rgba(238, 82, 83, 0.25) !important;
            border-color: #ee5253 !important;
            color: #ee5253 !important;
        }

        .quiz-score-banner {
            display: none;
            background-color: #26273b;
            border: 1px solid #1dd1a1;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            color: #1dd1a1;
        }

        /* Toggle corrigé exercice */
        .toggle-corrige-btn {
            background-color: #343650;
            color: #00d2d3;
            border: 1px solid #00d2d3;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            margin-top: 12px;
            display: inline-block;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-title">
            <span>📖</span>
            <span id="label-matiere">Matière</span>
        </div>
        <a href="accueil.html" class="btn-back">⬅ Retour à l'accueil</a>
    </header>

    <div class="container">

        <!-- Barre de sélection rapide de la matière -->
        <div class="matieres-bar" id="matieres-bar">
            <button class="matiere-chip" onclick="changerMatiere('Maths')">📐 Maths</button>
            <button class="matiere-chip" onclick="changerMatiere('Français')">🇫🇷 Français</button>
            <button class="matiere-chip" onclick="changerMatiere('Anglais')">🇬🇧 Anglais</button>
            <button class="matiere-chip" onclick="changerMatiere('Espagnol')">🇪🇸 Espagnol</button>
            <button class="matiere-chip" onclick="changerMatiere('Physique-Chimie')">🧪 Physique-Chimie</button>
            <button class="matiere-chip" onclick="changerMatiere('SVT')">🌿 SVT</button>
            <button class="matiere-chip" onclick="changerMatiere('Histoire')">📜 Histoire</button>
            <button class="matiere-chip" onclick="changerMatiere('Géographie')">🌍 Géographie</button>
            <button class="matiere-chip" onclick="changerMatiere('Technologie')">💻 Technologie</button>
            <button class="matiere-chip" onclick="changerMatiere('Latin-Grec')">🏛️ Latin / Grec</button>
            <button class="matiere-chip" onclick="changerMatiere('EMC')">⚖️ EMC</button>
            <button class="matiere-chip" onclick="changerMatiere('Arts')">🎨 Arts</button>
        </div>

        <!-- 1. Leçons enregistrées par l'administrateur -->
        <div class="card">
            <h2>📚 Fiches de leçons du cours</h2>
            <div class="lecons-list" id="lecons-conteneur">
                <p style="color: #a4b0be; font-size: 13px;">Chargement des fiches de cours...</p>
            </div>
        </div>

        <!-- 2. Générateur IA : Exercices & Quiz sur-mesure -->
        <div class="card">
            <h2>🤖 Entraînement intelligent avec l'IA</h2>
            <p style="font-size: 13px; color: #a4b0be; margin-bottom: 12px;">
                Indique le chapitre ou la notion que tu veux réviser, puis choisis de générer un exercice ou un quiz interactif :
            </p>

            <div class="generator-inputs">
                <input type="text" id="sujet-input" placeholder="Ex: Théorème de Pythagore, Les verbes irréguliers, La Révolution...">
                <button class="btn-gen btn-exercice" id="btn-gen-exo" onclick="genererExerciceIA()">
                    📝 Générer Exercice
                </button>
                <button class="btn-gen btn-quiz" id="btn-gen-quiz" onclick="genererQuizIA()">
                    🎯 Générer Quiz (QCM)
                </button>
            </div>

            <!-- Résultat Exercice -->
            <div class="ai-output-box" id="exercice-result"></div>

            <!-- Résultat Quiz -->
            <div class="quiz-score-banner" id="quiz-score"></div>
            <div class="quiz-container" id="quiz-box"></div>
        </div>

    </div>

    <script>
        const FIREBASE_URL = "https://cour-halea-default-rtdb.firebaseio.com";
        const CLE_API = "AQ.Ab8RN6JOyUF9wbanLDRGcIzzXnUpMzrLLYk75TLBPPHskY2VHg";

        // Récupération de la matière passée dans l'adresse URL
        const params = new URLSearchParams(window.location.search);
        let matiereActuelle = params.get("matiere") || "Maths";

        function initialiserPage() {
            document.getElementById("label-matiere").textContent = matiereActuelle;
            
            // Met en surbrillance le bouton de la matière active
            document.querySelectorAll(".matiere-chip").forEach(chip => {
                if (chip.textContent.includes(matiereActuelle)) {
                    chip.classList.add("active");
                } else {
                    chip.classList.remove("active");
                }
            });

            chargerLecons();
        }

        function changerMatiere(nom) {
            matiereActuelle = nom;
            document.getElementById("label-matiere").textContent = nom;
            
            document.querySelectorAll(".matiere-chip").forEach(chip => {
                if (chip.textContent.includes(nom)) {
                    chip.classList.add("active");
                } else {
                    chip.classList.remove("active");
                }
            });

            // Réinitialise les affichages
            document.getElementById("exercice-result").style.display = "none";
            document.getElementById("quiz-box").style.display = "none";
            document.getElementById("quiz-score").style.display = "none";
            document.getElementById("sujet-input").value = "";

            chargerLecons();
        }

        // =======================================================
        // 📚 CHARGEMENT DES LEÇONS FIREBASE
        // =======================================================
        async function chargerLecons() {
            const conteneur = document.getElementById("lecons-conteneur");
            conteneur.innerHTML = `<p style="color:#a4b0be; font-size:13px;">Chargement...</p>`;

            try {
                const res = await fetch(`${FIREBASE_URL}/lecons.json`);
                const data = await res.json();

                if (!data) {
                    conteneur.innerHTML = `<p style="color:#a4b0be; font-size:13px;">Aucune fiche publiée pour l'instant. Utilise l'IA ci-dessous pour t'entraîner !</p>`;
                    return;
                }

                // Filtrer les leçons de la matière actuelle
                const lecons = Object.values(data).filter(l => l.matiere.toLowerCase() === matiereActuelle.toLowerCase());

                if (lecons.length === 0) {
                    conteneur.innerHTML = `<p style="color:#a4b0be; font-size:13px;">Aucune fiche enregistrée en ${matiereActuelle}. Entre un sujet ci-dessous pour que l'IA t'entraîne !</p>`;
                    return;
                }

                conteneur.innerHTML = "";
                lecons.forEach(l => {
                    const div = document.createElement("div");
                    div.className = "lecon-item";
                    div.innerHTML = `
                        <h4>📌 ${l.titre}</h4>
                        <p>${l.contenu}</p>
                    `;
                    // Clic pour pré-remplir le champ de l'IA avec le titre de la leçon !
                    div.onclick = () => {
                        document.getElementById("sujet-input").value = l.titre;
                        document.getElementById("sujet-input").focus();
                    };
                    conteneur.appendChild(div);
                });

            } catch (e) {
                conteneur.innerHTML = `<p style="color:#ee5253; font-size:13px;">Erreur de connexion aux fiches.</p>`;
            }
        }

        // =======================================================
        // 📝 GÉNÉRATION D'EXERCICE AVEC CORRIGÉ
        // =======================================================
        async function genererExerciceIA() {
            const sujet = document.getElementById("sujet-input").value.trim() || matiereActuelle;
            const output = document.getElementById("exercice-result");
            const btnExo = document.getElementById("btn-gen-exo");
            const btnQuiz = document.getElementById("btn-gen-quiz");

            document.getElementById("quiz-box").style.display = "none";
            document.getElementById("quiz-score").style.display = "none";

            btnExo.disabled = true;
            btnQuiz.disabled = true;
            output.style.display = "block";
            output.innerHTML = `⏳ <em>L'IA conçoit un exercice d'entraînement sur "${sujet}"...</em>`;

            const prompt = `Tu es un professeur de collège/lycée en ${matiereActuelle}.
Crée un exercice d'entraînement clair et bien formulé sur le thème suivant : "${sujet}".
Format de réponse obligatoire :
1. Titre de l'exercice
2. Énoncé et consignes (questions claires et numérotées)
3. Un indice pour aider l'élève
4. ===CORRIGE===
5. La correction détaillée étape par étape avec le résultat final.`;

            try {
                const res = await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent", {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "x-goog-api-key": CLE_API },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });

                const data = await res.json();
                const texte = data.candidates?.[0]?.content?.parts?.[0]?.text;

                if (texte) {
                    const parties = texte.split("===CORRIGE===");
                    const enonce = parties[0];
                    const corrige = parties[1] || "Correction non disponible.";

                    output.innerHTML = `
                        <div style="color: #00d2d3; font-weight: bold; margin-bottom: 8px;">🎯 Exercice d'entraînement :</div>
                        <div>${enonce}</div>
                        <button class="toggle-corrige-btn" onclick="toggleCorrige()">👁️ Afficher / Masquer la correction</button>
                        <div id="bloc-corrige" style="display:none; margin-top:12px; padding:12px; background-color:#26273b; border-left:3px solid #1dd1a1; border-radius:6px; color:#1dd1a1;">
                            <strong>✅ Corrigé détaillé :</strong><br>${corrige}
                        </div>
                    `;
                } else {
                    output.textContent = "Désolé, impossible de créer l'exercice pour le moment.";
                }
            } catch (err) {
                output.textContent = "Erreur de connexion avec l'IA.";
            }

            btnExo.disabled = false;
            btnQuiz.disabled = false;
        }

        function toggleCorrige() {
            const bloc = document.getElementById("bloc-corrige");
            bloc.style.display = (bloc.style.display === "block") ? "none" : "block";
        }

        // =======================================================
        // 🎯 GÉNÉRATION DE QUIZ INTERACTIF (QCM)
        // =======================================================
        let scoreQuiz = 0;
        let questionsRepondues = 0;
        let totalQuestions = 0;

        async function genererQuizIA() {
            const sujet = document.getElementById("sujet-input").value.trim() || matiereActuelle;
            const quizBox = document.getElementById("quiz-box");
            const scoreBox = document.getElementById("quiz-score");
            const btnExo = document.getElementById("btn-gen-exo");
            const btnQuiz = document.getElementById("btn-gen-quiz");

            document.getElementById("exercice-result").style.display = "none";
            scoreBox.style.display = "none";

            btnExo.disabled = true;
            btnQuiz.disabled = true;
            quizBox.style.display = "flex";
            quizBox.innerHTML = `<p style="color:#a4b0be; text-align:center;">⏳ <em>Génération d'un quiz interactif sur "${sujet}"...</em></p>`;

            const prompt = `Tu es un professeur en ${matiereActuelle}. Génère un quiz de 3 questions à choix multiples (QCM) sur le sujet : "${sujet}".
Réponds STRICTEMENT sous forme d'un tableau JSON valide, sans balises markdown de code, sans texte avant ni après.
Exemple de format attendu :
[
  {
    "question": "Quel est le carré de 5 ?",
    "options": ["10", "25", "20", "15"],
    "correctIndex": 1,
    "explication": "5 x 5 = 25."
  }
]`;

            try {
                const res = await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent", {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "x-goog-api-key": CLE_API },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });

                const data = await res.json();
                let texte = data.candidates?.[0]?.content?.parts?.[0]?.text || "";

                // Nettoyage des balises JSON si Gemini les ajoute
                texte = texte.replace(/```json/g, "").replace(/```/g, "").trim();

                const questions = JSON.parse(texte);
                totalQuestions = questions.length;
                scoreQuiz = 0;
                questionsRepondues = 0;

                quizBox.innerHTML = "";
                questions.forEach((q, indexQ) => {
                    const card = document.createElement("div");
                    card.className = "quiz-card";
                    card.innerHTML = `
                        <div class="quiz-question">Question ${indexQ + 1} : ${q.question}</div>
                        <div class="quiz-options" id="options-q-${indexQ}"></div>
                        <div id="expl-q-${indexQ}" style="display:none; margin-top:10px; font-size:12px; color:#c8d6e5;"></div>
                    `;

                    const optionsDiv = card.querySelector(`#options-q-${indexQ}`);
                    q.options.forEach((opt, indexOpt) => {
                        const btnOpt = document.createElement("button");
                        btnOpt.className = "quiz-option";
                        btnOpt.textContent = opt;
                        btnOpt.onclick = () => validerReponseQuiz(indexQ, indexOpt, q.correctIndex, q.explication);
                        optionsDiv.appendChild(btnOpt);
                    });

                    quizBox.appendChild(card);
                });

            } catch (err) {
                quizBox.innerHTML = `<p style="color:#ee5253; text-align:center;">Erreur lors de la création du quiz. Réessaie avec un autre terme !</p>`;
            }

            btnExo.disabled = false;
            btnQuiz.disabled = false;
        }

        function validerReponseQuiz(indexQ, optionChoisie, bonneOption, explication) {
            const optionsDiv = document.getElementById(`options-q-${indexQ}`);
            const boutons = optionsDiv.querySelectorAll(".quiz-option");
            const explDiv = document.getElementById(`expl-q-${indexQ}`);

            // Désactive les boutons de cette question pour éviter de recliquer
            boutons.forEach(b => b.disabled = true);

            if (optionChoisie === bonneOption) {
                boutons[optionChoisie].classList.add("correct");
                scoreQuiz++;
            } else {
                boutons[optionChoisie].classList.add("wrong");
                boutons[bonneOption].classList.add("correct");
            }

            explDiv.innerHTML = `💡 <em>${explication}</em>`;
            explDiv.style.display = "block";

            questionsRepondues++;

            // Si toutes les questions ont été répondues, afficher le score final
            if (questionsRepondues === totalQuestions) {
                const scoreBox = document.getElementById("quiz-score");
                scoreBox.innerHTML = `🏆 Résultat final : <strong>${scoreQuiz} / ${totalQuestions}</strong> ${scoreQuiz === totalQuestions ? '🎉 Félicitations, un sans-faute !' : '💪 Continue de t\'entraîner !'}`;
                scoreBox.style.display = "block";
                scoreBox.scrollIntoView({ behavior: "smooth" });
            }
        }

        // Lancement au chargement
        initialiserPage();
    </script>
</body>
</html>
