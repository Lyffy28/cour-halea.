<script>
        const FIREBASE_URL = "https://cour-halea-default-rtdb.firebaseio.com";

        // Configuration EmailJS avec tes clés réelles
        const EMAILJS_PUBLIC_KEY = "vfjPplfwPgtt3bn10";
        const EMAILJS_SERVICE_ID = "service_lc5s6yo";
        const EMAILJS_TEMPLATE_ID = "cf97ges";

        try {
            emailjs.init({ publicKey: EMAILJS_PUBLIC_KEY });
        } catch (e) {
            console.error("Erreur init EmailJS", e);
        }

        let actionEnCours = null;
        let codeAttendu = null;
        let expirationCode = 0;
        let donneesTemporaires = {};

        function afficherMessage(texte, type = "error") {
            const boite = document.getElementById("boite-statut");
            boite.className = "status-msg " + (type === "success" ? "status-success" : "status-error");
            boite.textContent = texte;
            boite.style.display = "block";
        }

        function masquerMessage() {
            document.getElementById("boite-statut").style.display = "none";
        }

        function basculerVue(idVue) {
            masquerMessage();
            ["vue-connexion", "vue-inscription", "vue-oubli", "vue-validation-code"].forEach(v => {
                document.getElementById(v).style.display = (v === idVue ? "block" : "none");
            });
        }

        function genererCodeAleatoire() {
            return Math.floor(100000 + Math.random() * 900000).toString();
        }

        // --- 1. CONNEXION NORMALE ---
        async function traiterConnexion(e) {
            e.preventDefault();
            masquerMessage();
            const identifiant = document.getElementById("connexion-identifiant").value.trim().toLowerCase();
            const mdp = document.getElementById("connexion-mdp").value;
            const btn = document.getElementById("btn-submit-connexion");

            btn.textContent = "Connexion...";
            btn.disabled = true;

            try {
                const res = await fetch(`${FIREBASE_URL}/comptes.json`);
                const comptes = await res.json();

                if (!comptes) {
                    afficherMessage("Aucun compte existant.");
                    return;
                }

                const compteTrouve = Object.values(comptes).find(c => 
                    (c.pseudo && c.pseudo.toLowerCase() === identifiant) || 
                    (c.email && c.email.toLowerCase() === identifiant)
                );

                if (!compteTrouve || compteTrouve.password !== mdp) {
                    afficherMessage("Identifiant ou mot de passe incorrect.");
                    return;
                }

                if (compteTrouve.banni === true) {
                    afficherMessage("Ce compte a été suspendu.");
                    return;
                }

                localStorage.setItem("utilisateur_pseudo", compteTrouve.pseudo);
                localStorage.setItem("utilisateur_email", compteTrouve.email || "");
                window.location.href = "accueil.html";
            } catch (err) {
                afficherMessage("Erreur de connexion à Firebase.");
            } finally {
                btn.textContent = "Se connecter";
                btn.disabled = false;
            }
        }

        // --- 2. INSCRIPTION AVEC CODE ---
        async function demanderCodeInscription(e) {
            e.preventDefault();
            masquerMessage();

            const pseudo = document.getElementById("inscr-pseudo").value.trim();
            const email = document.getElementById("inscr-email").value.trim().toLowerCase();
            const mdp = document.getElementById("inscr-mdp").value;
            const btn = document.getElementById("btn-submit-inscr");

            btn.textContent = "Envoi du code...";
            btn.disabled = true;

            try {
                const res = await fetch(`${FIREBASE_URL}/comptes.json`);
                const comptes = await res.json() || {};

                const existeDeja = Object.values(comptes).some(c => 
                    (c.pseudo && c.pseudo.toLowerCase() === pseudo.toLowerCase()) || 
                    (c.email && c.email.toLowerCase() === email)
                );

                if (existeDeja) {
                    afficherMessage("Ce pseudo ou cet e-mail est déjà utilisé.");
                    return;
                }

                codeAttendu = genererCodeAleatoire();
                expirationCode = Date.now() + 10 * 60 * 1000;
                actionEnCours = "inscription";
                donneesTemporaires = { pseudo, email, password: mdp };

                // On envoie à la fois to_email et email pour être 100% sûr que le template le reçoive
                const reponseEmailJS = await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
                    to_name: pseudo,
                    to_email: email,
                    email: email,
                    code: codeAttendu
                });

                console.log("Succès EmailJS :", reponseEmailJS);

                document.getElementById("champ-nouveau-mdp").style.display = "none";
                document.getElementById("texte-info-code").textContent = `Code envoyé à ${email}`;
                basculerVue("vue-validation-code");
                afficherMessage("Code envoyé avec succès ! Vérifie tes spams.", "success");
            } catch (err) {
                console.error("Détail Erreur EmailJS :", err);
                const detail = err.text || err.message || JSON.stringify(err);
                afficherMessage(`Échec EmailJS : ${detail}`);
            } finally {
                btn.textContent = "Recevoir le code";
                btn.disabled = false;
            }
        }

        // --- 3. MOT DE PASSE OUBLIÉ AVEC CODE ---
        async function demanderCodeRecuperation(e) {
            e.preventDefault();
            masquerMessage();

            const email = document.getElementById("oubli-email").value.trim().toLowerCase();
            const btn = document.getElementById("btn-submit-oubli");

            btn.textContent = "Recherche du compte...";
            btn.disabled = true;

            try {
                const res = await fetch(`${FIREBASE_URL}/comptes.json`);
                const comptes = await res.json() || {};

                const cleCompte = Object.keys(comptes).find(k => 
                    comptes[k].email && comptes[k].email.toLowerCase() === email
                );

                if (!cleCompte) {
                    afficherMessage("Aucun compte avec cette adresse mail. Crée d'abord un compte via 'Créer un compte'.");
                    return;
                }

                const compte = comptes[cleCompte];
                codeAttendu = genererCodeAleatoire();
                expirationCode = Date.now() + 10 * 60 * 1000;
                actionEnCours = "oubli";
                donneesTemporaires = { cle: cleCompte, pseudo: compte.pseudo, email };

                await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
                    to_name: compte.pseudo,
                    to_email: email,
                    email: email,
                    code: codeAttendu
                });

                document.getElementById("champ-nouveau-mdp").style.display = "block";
                document.getElementById("texte-info-code").textContent = `Code envoyé à ${email}`;
                basculerVue("vue-validation-code");
                afficherMessage("Code envoyé par e-mail ! (Pense aux spams)", "success");
            } catch (err) {
                console.error("Détail Erreur EmailJS :", err);
                const detail = err.text || err.message || JSON.stringify(err);
                afficherMessage(`Échec EmailJS : ${detail}`);
            } finally {
                btn.textContent = "Envoyer le code";
                btn.disabled = false;
            }
        }

        // --- 4. VALIDATION DU CODE ---
        async function validerCodeRecu(e) {
            e.preventDefault();
            masquerMessage();

            const saisie = document.getElementById("input-code-verif").value.trim();

            if (Date.now() > expirationCode) {
                afficherMessage("Le code a expiré. Recommence l'opération.");
                return;
            }

            if (saisie !== codeAttendu) {
                afficherMessage("Code incorrect. Vérifie bien les 6 chiffres.");
                return;
            }

            if (actionEnCours === "inscription") {
                const cle = encodeURIComponent(donneesTemporaires.pseudo.toLowerCase());
                await fetch(`${FIREBASE_URL}/comptes/${cle}.json`, {
                    method: "PUT",
                    body: JSON.stringify({
                        pseudo: donneesTemporaires.pseudo,
                        email: donneesTemporaires.email,
                        password: donneesTemporaires.password,
                        dateCreation: new Date().toISOString()
                    })
                });

                alert("Compte validé avec succès ! Tu peux te connecter.");
                basculerVue("vue-connexion");
            } 
            else if (actionEnCours === "oubli") {
                const nouveauMdp = document.getElementById("input-nouveau-mdp").value.trim();
                if (nouveauMdp.length < 4) {
                    afficherMessage("Le mot de passe doit faire au moins 4 caractères.");
                    return;
                }

                await fetch(`${FIREBASE_URL}/comptes/${donneesTemporaires.cle}/password.json`, {
                    method: "PUT",
                    body: JSON.stringify(nouveauMdp)
                });

                alert("Mot de passe mis à jour ! Connecte-toi.");
                basculerVue("vue-connexion");
            }
        }
    </script>
