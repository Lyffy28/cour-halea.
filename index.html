<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cour-halea - Connexion</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #1e1e2e;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            background-color: #26273b;
            border: 1px solid #3d3f58;
            border-radius: 12px;
            padding: 30px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
            text-align: center;
        }

        h1 {
            color: #00d2d3;
            font-size: 24px;
            margin-bottom: 8px;
        }

        p.subtitle {
            color: #a4b0be;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            font-size: 13px;
            color: #c8d6e5;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #484b6a;
            background-color: #1e1e2e;
            color: #ffffff;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
        }

        input:focus {
            border-color: #00d2d3;
        }

        .btn-connexion {
            width: 100%;
            background-color: #00d2d3;
            color: #1e1e2e;
            border: none;
            padding: 13px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-connexion:hover {
            background-color: #01a3a4;
        }

        .error-msg {
            color: #ee5253;
            font-size: 13px;
            margin-top: 12px;
            min-height: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h1>Cour-halea</h1>
        <p class="subtitle">Plateforme d'études & de révisions</p>

        <form id="form-login" onsubmit="validerConnexion(event)">
            <div class="input-group">
                <div>
                    <label for="pseudo">Pseudo</label>
                    <input type="text" id="pseudo" placeholder="Ex: Max" required autocomplete="username">
                </div>
                <div>
                    <label for="email">Adresse E-mail</label>
                    <input type="email" id="email" placeholder="exemple@mail.com" required autocomplete="email">
                </div>
            </div>

            <button type="submit" class="btn-connexion">Se connecter</button>
            <div class="error-msg" id="message-erreur"></div>
        </form>
    </div>

    <script>
        function validerConnexion(event) {
            event.preventDefault();

            const pseudo = document.getElementById("pseudo").value.trim();
            const email = document.getElementById("email").value.trim();
            const zoneErreur = document.getElementById("message-erreur");

            zoneErreur.textContent = "";

            if (pseudo.length < 2) {
                zoneErreur.textContent = "Le pseudo doit comporter au moins 2 caractères.";
                return;
            }

            // Expression régulière de contrôle d'adresse e-mail standard
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                zoneErreur.textContent = "Veuillez entrer une adresse e-mail valide (ex: contact@domaine.com).";
                return;
            }

            // Enregistrement des données de l'utilisateur connecté
            localStorage.setItem("utilisateur_pseudo", pseudo);
            localStorage.setItem("utilisateur_email", email.toLowerCase());

            // Redirection vers l'accueil
            window.location.href = "accueil.html";
        }
    </script>

</body>
</html>
