<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cour-halea - Connexion</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #1e1e2e;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            background-color: #26273b;
            border: 1px solid #3d3f58;
            border-radius: 12px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
            text-align: center;
        }

        h1 {
            color: #00d2d3;
            font-size: 26px;
            margin-bottom: 5px;
        }

        p.subtitle {
            color: #a4b0be;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .tabs {
            display: flex;
            margin-bottom: 20px;
            border-radius: 8px;
            background-color: #1e1e2e;
            border: 1px solid #3d3f58;
            overflow: hidden;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: none;
            color: #a4b0be;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }

        .tab-btn.active {
            background-color: #00d2d3;
            color: #1e1e2e;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            font-size: 13px;
            color: #c8d6e5;
            font-weight: bold;
            margin-bottom: 5px;
            display: block;
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #484b6a;
            background-color: #1e1e2e;
            color: #ffffff;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
        }

        input:focus {
            border-color: #00d2d3;
        }

        .btn-submit {
            width: 100%;
            background-color: #00d2d3;
            color: #1e1e2e;
            border: none;
            padding: 13px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-submit:hover {
            background-color: #01a3a4;
        }

        .error-msg {
            color: #ee5253;
            font-size: 13px;
            margin-top: 12px;
            min-height: 18px;
            font-weight: bold;
        }

        .success-msg {
            color: #1dd1a1;
            font-size: 13px;
            margin-top: 12px;
            min-height: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h1>Cour-halea</h1>
        <p class="subtitle">Espace d'études & de révisions</p>

        <!-- Onglets -->
        <div class="tabs">
            <button class="tab-btn active" id="btn-tab-connexion" onclick="changerOnglet('connexion')">Connexion</button>
            <button class="tab-btn" id="btn-tab-inscription" onclick="changerOnglet('inscription')">Créer un compte</button>
        </div>

        <form id="auth-form" onsubmit="gererSoumission(event)">
            <div class="input-group">
                <div>
                    <label for="pseudo">Pseudo</label>
                    <input type="text" id="pseudo" placeholder="Ton pseudo" required autocomplete="username">
                </div>

                <div>
                    <label for="email">Adresse E-mail</label>
                    <input type="email" id="email" placeholder="exemple@mail.com" required autocomplete="email">
                </div>

                <div>
                    <label for="password">Mot de passe</label>
                    <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
                </div>
            </div>

            <button type="submit" class="btn-submit" id="btn-action">Se connecter</button>
            <div class="error-msg" id="msg-erreur"></div>
            <div class="success-msg" id="msg-succes"></div>
        </form>
    </div>

    <script>
        // Si l'utilisateur est déjà connecté, aller directement à l'accueil
        if (localStorage.getItem("utilisateur_pseudo")) {
            window.location.href = "accueil.html";
        }

        let modeActuel = "connexion";

        function changerOnglet(mode) {
            modeActuel = mode;
            const btnConnexion = document.getElementById("btn-tab-connexion");
            const btnInscription = document.getElementById("btn-tab-inscription");
            const btnAction = document.getElementById("btn-action");
            const msgErreur = document.getElementById("msg-erreur");
            const msgSucces = document.getElementById("msg-succes");

            msgErreur.textContent = "";
            msgSucces.textContent = "";

            if (mode === "connexion") {
                btnConnexion.classList.add("active");
                btnInscription.classList.remove("active");
                btnAction.textContent = "Se connecter";
                btnAction.style.backgroundColor = "#00d2d3";
            } else {
                btnInscription.classList.add("active");
                btnConnexion.classList.remove("active");
                btnAction.textContent = "S'inscrire";
                btnAction.style.backgroundColor = "#1dd1a1";
            }
        }

        function recupererComptes() {
            return JSON.parse(localStorage.getItem("comptes_utilisateurs") || "[]");
        }

        function sauvegarderComptes(comptes) {
            localStorage.setItem("comptes_utilisateurs", JSON.stringify(comptes));
        }

        function gererSoumission(event) {
            event.preventDefault();

            const pseudo = document.getElementById("pseudo").value.trim();
            const email = document.getElementById("email").value.trim().toLowerCase();
            const password = document.getElementById("password").value;
            const msgErreur = document.getElementById("msg-erreur");
            const msgSucces = document.getElementById("msg-succes");

            msgErreur.textContent = "";
            msgSucces.textContent = "";

            if (pseudo.length < 2) {
                msgErreur.textContent = "Le pseudo doit comporter au moins 2 caractères.";
                return;
            }

            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                msgErreur.textContent = "Veuillez entrer une adresse e-mail valide.";
                return;
            }

            if (password.length < 4) {
                msgErreur.textContent = "Le mot de passe doit comporter au moins 4 caractères.";
                return;
            }

            let comptes = recupererComptes();

            // Inscription
            if (modeActuel === "inscription") {
                const pseudoExiste = comptes.some(c => c.pseudo.toLowerCase() === pseudo.toLowerCase());
                if (pseudoExiste) {
                    msgErreur.textContent = "Ce pseudo est déjà utilisé.";
                    return;
                }

                const emailExiste = comptes.some(c => c.email.toLowerCase() === email);
                if (emailExiste) {
                    msgErreur.textContent = "Cette adresse e-mail possède déjà un compte.";
                    return;
                }

                comptes.push({
                    pseudo: pseudo,
                    email: email,
                    password: password
                });

                sauvegarderComptes(comptes);

                msgSucces.textContent = "Compte créé ! Tu peux maintenant te connecter.";
                setTimeout(() => {
                    changerOnglet("connexion");
                    document.getElementById("password").value = "";
                }, 1000);
                return;
            }

            // Connexion
            if (modeActuel === "connexion") {
                const compteValide = comptes.find(c => 
                    c.pseudo.toLowerCase() === pseudo.toLowerCase() &&
                    c.email.toLowerCase() === email &&
                    c.password === password
                );

                if (!compteValide) {
                    msgErreur.textContent = "Combinaison incorrecte (pseudo, e-mail et mot de passe doivent correspondre).";
                    return;
                }

                // Session active
                localStorage.setItem("utilisateur_pseudo", compteValide.pseudo);
                localStorage.setItem("utilisateur_email", compteValide.email);

                window.location.href = "accueil.html";
            }
        }
    </script>

</body>
</html>
