<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cour-halea - Connexion</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #1e1e2e;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }

        .login-card {
            background-color: #26273b;
            border: 1px solid #3d3f58;
            border-radius: 12px;
            padding: 25px 20px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
            text-align: center;
        }

        h1 {
            color: #00d2d3;
            font-size: 26px;
            margin-bottom: 5px;
        }

        p.subtitle {
            color: #a4b0be;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .tabs {
            display: flex;
            margin-bottom: 20px;
            border-radius: 8px;
            background-color: #1e1e2e;
            border: 1px solid #3d3f58;
            overflow: hidden;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: none;
            color: #a4b0be;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }

        .tab-btn.active {
            background-color: #00d2d3;
            color: #1e1e2e;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            font-size: 13px;
            color: #c8d6e5;
            font-weight: bold;
            margin-bottom: 4px;
            display: block;
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #484b6a;
            background-color: #1e1e2e;
            color: #ffffff;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
        }

        input:focus {
            border-color: #00d2d3;
        }

        .btn-submit {
            width: 100%;
            background-color: #00d2d3;
            color: #1e1e2e;
            border: none;
            padding: 13px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-submit:hover {
            background-color: #01a3a4;
        }

        .btn-submit:disabled {
            background-color: #484b6a;
            cursor: not-allowed;
            color: #a4b0be;
        }

        .error-msg {
            color: #ee5253;
            font-size: 13px;
            margin-top: 12px;
            min-height: 18px;
            font-weight: bold;
        }

        .success-msg {
            color: #1dd1a1;
            font-size: 13px;
            margin-top: 12px;
            min-height: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h1>Cour-halea</h1>
        <p class="subtitle">Espace d'études & de révisions</p>

        <!-- Onglets Connexion / Inscription -->
        <div class="tabs">
            <button class="tab-btn active" id="btn-tab-connexion" onclick="changerOnglet('connexion')">Connexion</button>
            <button class="tab-btn" id="btn-tab-inscription" onclick="changerOnglet('inscription')">Créer un compte</button>
        </div>

        <form id="auth-form" onsubmit="gererSoumission(event)">
            <div class="input-group">
                <div>
                    <label for="pseudo">Pseudo</label>
                    <input type="text" id="pseudo" placeholder="Ex: Max" required autocomplete="username">
                </div>

                <div>
                    <label for="email">Adresse E-mail</label>
                    <input type="email" id="email" placeholder="exemple@mail.com" required autocomplete="email">
                </div>

                <div>
                    <label for="password">Mot de passe</label>
                    <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
                </div>
            </div>

            <button type="submit" class="btn-submit" id="btn-action">Se connecter</button>
            <div class="error-msg" id="msg-erreur"></div>
            <div class="success-msg" id="msg-succes"></div>
        </form>
    </div>

    <script>
        // Ta base Firebase centrale en direct
        const FIREBASE_URL = "https://cour-halea-default-rtdb.firebaseio.com";

        // Redirige si déjà connecté
        if (localStorage.getItem("utilisateur_pseudo")) {
            window.location.href = "accueil.html";
        }

        let modeActuel = "connexion";

        function changerOnglet(mode) {
            modeActuel = mode;
            const btnConnexion = document.getElementById("btn-tab-connexion");
            const btnInscription = document.getElementById("btn-tab-inscription");
            const btnAction = document.getElementById("btn-action");
            const msgErreur = document.getElementById("msg-erreur");
            const msgSucces = document.getElementById("msg-succes");

            msgErreur.textContent = "";
            msgSucces.textContent = "";

            if (mode === "connexion") {
                btnConnexion.classList.add("active");
                btnInscription.classList.remove("active");
                btnAction.textContent = "Se connecter";
                btnAction.style.backgroundColor = "#00d2d3";
            } else {
                btnInscription.classList.add("active");
                btnConnexion.classList.remove("active");
                btnAction.textContent = "Créer mon compte";
                btnAction.style.backgroundColor = "#1dd1a1";
            }
        }

        async function gererSoumission(event) {
            event.preventDefault();

            const pseudo = document.getElementById("pseudo").value.trim();
            const email = document.getElementById("email").value.trim().toLowerCase();
            const password = document.getElementById("password").value;
            const btnAction = document.getElementById("btn-action");
            const msgErreur = document.getElementById("msg-erreur");
            const msgSucces = document.getElementById("msg-succes");

            msgErreur.textContent = "";
            msgSucces.textContent = "";

            // Vérifications de saisie
            if (pseudo.length < 2) {
                msgErreur.textContent = "Le pseudo doit comporter au moins 2 caractères.";
                return;
            }

            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                msgErreur.textContent = "Veuillez entrer une adresse e-mail valide.";
                return;
            }

            if (password.length < 4) {
                msgErreur.textContent = "Le mot de passe doit comporter au moins 4 caractères.";
                return;
            }

            btnAction.disabled = true;
            btnAction.textContent = "⏳ Traitement...";

            try {
                // Clé unique propre pour le compte dans Firebase : pseudo en minuscules
                const pseudoCle = encodeURIComponent(pseudo.toLowerCase());

                // ==========================================
                // 1. INSCRIPTION DANS FIREBASE
                // ==========================================
                if (modeActuel === "inscription") {
                    // Vérifier si le pseudo existe déjà dans Firebase
                    const checkRes = await fetch(`${FIREBASE_URL}/comptes/${pseudoCle}.json`);
                    const existant = await checkRes.json();

                    if (existant) {
                        msgErreur.textContent = "Ce pseudo est déjà utilisé. Choisis-en un autre.";
                        btnAction.disabled = false;
                        btnAction.textContent = "Créer mon compte";
                        return;
                    }

                    // Enregistrer le compte avec mot de passe dans Firebase
                    const saveRes = await fetch(`${FIREBASE_URL}/comptes/${pseudoCle}.json`, {
                        method: "PUT",
                        body: JSON.stringify({
                            pseudo: pseudo,
                            email: email,
                            password: password,
                            dateCreation: new Date().toISOString()
                        })
                    });

                    if (saveRes.ok) {
                        msgSucces.textContent = "Compte créé avec succès dans la base ! Basculement...";
                        setTimeout(() => {
                            changerOnglet("connexion");
                            document.getElementById("password").value = "";
                            btnAction.disabled = false;
                        }, 1200);
                    } else {
                        msgErreur.textContent = "Erreur lors de l'enregistrement sur le serveur.";
                        btnAction.disabled = false;
                        btnAction.textContent = "Créer mon compte";
                    }
                    return;
                }

                // ==========================================
                // 2. CONNEXION AVEC VÉRIFICATION FIREBASE
                // ==========================================
                if (modeActuel === "connexion") {
                    // Récupérer le compte depuis Firebase
                    const res = await fetch(`${FIREBASE_URL}/comptes/${pseudoCle}.json`);
                    const compte = await res.json();

                    if (!compte) {
                        msgErreur.textContent = "Aucun compte trouvé avec ce pseudo.";
                        btnAction.disabled = false;
                        btnAction.textContent = "Se connecter";
                        return;
                    }

                    // Vérifier l'e-mail et le mot de passe
                    if (compte.email.toLowerCase() !== email || compte.password !== password) {
                        msgErreur.textContent = "Identifiants incorrects (vérifie ton e-mail ou ton mot de passe).";
                        btnAction.disabled = false;
                        btnAction.textContent = "Se connecter";
                        return;
                    }

                    // Connexion validée : on mémorise la session active de cet utilisateur
                    localStorage.setItem("utilisateur_pseudo", compte.pseudo);
                    localStorage.setItem("utilisateur_email", compte.email);

                    msgSucces.textContent = "Connexion réussie ! Redirection...";
                    setTimeout(() => {
                        window.location.href = "accueil.html";
                    }, 500);
                }

            } catch (err) {
                msgErreur.textContent = "Erreur de connexion avec le serveur Firebase. Vérifie ta connexion internet.";
                btnAction.disabled = false;
                btnAction.textContent = (modeActuel === "connexion") ? "Se connecter" : "Créer mon compte";
            }
        }
    </script>

</body>
</html>
