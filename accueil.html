<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cour-halea - Accueil</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #1e1e2e;
            color: #ffffff;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* 1. Colonne gauche */
        .sidebar-left {
            width: 90px;
            background-color: #26273b;
            border-right: 1px solid #3d3f58;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .left-btn {
            background: none;
            border: none;
            border-bottom: 1px solid #3d3f58;
            color: #c8d6e5;
            padding: 25px 5px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            width: 100%;
            transition: 0.2s;
        }

        .left-btn:hover {
            background-color: #343650;
            color: #00d2d3;
        }

        .bottom-left-group {
            display: flex;
            flex-direction: column;
        }

        .add-friend-btn {
            background: none;
            border: none;
            border-top: 1px solid #3d3f58;
            color: #1dd1a1;
            padding: 16px 0;
            font-size: 26px;
            cursor: pointer;
            text-align: center;
            width: 100%;
            transition: 0.2s;
        }

        .add-friend-btn:hover {
            background-color: #343650;
            color: #10ac84;
        }

        .settings-btn {
            background: none;
            border: none;
            border-top: 1px solid #3d3f58;
            color: #c8d6e5;
            padding: 16px 0;
            font-size: 20px;
            cursor: pointer;
            text-align: center;
            width: 100%;
        }

        /* 2. Centre */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-y: auto;
        }

        .search-bar {
            width: 90%;
            max-width: 550px;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 25px;
            border: 1px solid #484b6a;
            background-color: #2b2c40;
            color: #ffffff;
            outline: none;
        }

        .search-bar:focus {
            border-color: #00d2d3;
        }

        /* Modales */
        .modal-box {
            display: none;
            flex-direction: column;
            width: 100%;
            max-width: 650px;
            height: 480px;
            background-color: #26273b;
            border-radius: 12px;
            margin-top: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        #chat-ia {
            border: 1px solid #00d2d3;
        }

        #chat-entraide {
            border: 1px solid #ff9f43;
        }

        #friends-panel {
            border: 1px solid #1dd1a1;
            height: auto;
            max-height: 480px;
            padding-bottom: 15px;
        }

        #admin-panel {
            display: none;
            background-color: #2b2c40;
            margin-top: 25px;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #ff9f43;
            text-align: center;
            width: 100%;
            max-width: 320px;
        }

        #admin-panel input {
            padding: 10px;
            font-size: 18px;
            width: 120px;
            text-align: center;
            border-radius: 6px;
            border: 1px solid #484b6a;
            background-color: #1e1e2e;
            color: #ffffff;
            letter-spacing: 4px;
            margin: 15px 0;
            outline: none;
        }

        .chat-header {
            background-color: #1e1e2e;
            padding: 12px 16px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #3d3f58;
        }

        .close-btn {
            background: none;
            border: none;
            color: #a4b0be;
            font-size: 20px;
            cursor: pointer;
        }

        .close-btn:hover {
            color: #ee5253;
        }

        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .msg {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.4;
            white-space: pre-wrap;
        }

        .msg-ia {
            background-color: #343650;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            color: #ffffff;
        }

        .msg-user {
            background-color: #00d2d3;
            color: #1e1e2e;
            font-weight: 500;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .msg-group-other {
            background-color: #343650;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        .msg-group-me {
            background-color: #ff9f43;
            color: #1e1e2e;
            font-weight: 500;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .msg-author {
            font-size: 11px;
            font-weight: bold;
            margin-bottom: 3px;
            opacity: 0.85;
        }

        .msg-time {
            font-size: 10px;
            margin-left: 6px;
            opacity: 0.7;
        }

        .chat-input-zone {
            display: flex;
            border-top: 1px solid #3d3f58;
            background-color: #1e1e2e;
            padding: 10px;
            gap: 10px;
        }

        .chat-input-zone input {
            flex: 1;
            background-color: #26273b;
            border: 1px solid #3d3f58;
            padding: 10px 14px;
            color: #ffffff;
            border-radius: 20px;
            outline: none;
            font-size: 14px;
        }

        .btn-send {
            border: none;
            font-weight: bold;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
        }

        /* Panneau Amis */
        .friends-body {
            padding: 15px;
            overflow-y: auto;
        }

        .friends-input-zone {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .friends-input-zone input {
            flex: 1;
            background-color: #1e1e2e;
            border: 1px solid #484b6a;
            padding: 10px;
            border-radius: 8px;
            color: #ffffff;
            outline: none;
        }

        .btn-add-submit {
            background-color: #1dd1a1;
            color: #1e1e2e;
            border: none;
            font-weight: bold;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
        }

        .friends-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .friend-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #1e1e2e;
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid #3d3f58;
        }

        .btn-del-friend {
            background-color: #ee5253;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        /* 3. Colonne droite */
        .sidebar-right {
            width: 170px;
            background-color: #26273b;
            border-left: 1px solid #3d3f58;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .top-icons {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 12px 5px;
            border-bottom: 1px solid #3d3f58;
        }

        .profile-badge {
            background-color: #00d2d3;
            color: #1e1e2e;
            border-radius: 50%;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
        }

        .hamburger-btn {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 24px;
            cursor: pointer;
        }

        .admin-dropdown {
            display: none;
            background-color: #1e1e2e;
            border-bottom: 1px solid #3d3f58;
            padding: 10px;
            text-align: center;
        }

        .admin-dropdown button {
            background-color: #ff9f43;
            color: #1e1e2e;
            border: none;
            border-radius: 4px;
            padding: 8px;
            font-size: 13px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
        }

        .right-item {
            padding: 16px 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid #3d3f58;
            font-size: 15px;
            cursor: pointer;
            color: #c8d6e5;
            background: none;
            border-left: none;
            border-right: none;
            border-top: none;
            width: 100%;
            transition: 0.2s;
        }

        .right-item:hover {
            background-color: #343650;
            color: #ffffff;
        }

        .sub-menu {
            display: none;
            background-color: #1e1e2e;
            border-bottom: 1px solid #3d3f58;
        }

        .sub-item {
            display: block;
            width: 100%;
            padding: 12px 15px;
            background: none;
            border: none;
            border-bottom: 1px solid #2d2f44;
            color: #00d2d3;
            font-size: 14px;
            text-align: left;
            cursor: pointer;
            transition: 0.2s;
        }

        .sub-item:hover {
            background-color: #2b2c40;
            padding-left: 20px;
        }

        /* 📱 Adaptation Mobile */
        @media (max-width: 768px) {
            body {
                flex-direction: column;
                height: auto;
                min-height: 100vh;
                overflow-y: auto;
            }

            .sidebar-left {
                width: 100%;
                height: auto;
                flex-direction: row;
                border-right: none;
                border-bottom: 1px solid #3d3f58;
                order: 1;
            }

            .sidebar-left > div:first-child {
                display: flex;
                flex: 1;
            }

            .left-btn {
                writing-mode: horizontal-tb;
                transform: none;
                padding: 12px 10px;
                border-bottom: none;
                border-right: 1px solid #3d3f58;
                font-size: 13px;
                flex: 1;
            }

            .bottom-left-group {
                flex-direction: row;
            }

            .add-friend-btn {
                width: 50px;
                padding: 10px 0;
                border-top: none;
                border-left: 1px solid #3d3f58;
                font-size: 20px;
            }

            .settings-btn {
                width: 50px;
                padding: 10px 0;
                border-top: none;
                border-left: 1px solid #3d3f58;
            }

            .main-content {
                order: 2;
                padding: 15px 10px;
                min-height: calc(100vh - 280px);
            }

            .search-bar {
                width: 95%;
            }

            .modal-box {
                height: 420px;
            }

            .sidebar-right {
                width: 100%;
                height: auto;
                border-left: none;
                border-top: 2px solid #00d2d3;
                order: 3;
            }

            .right-item {
                padding: 14px;
                font-size: 16px;
            }

            .sub-item {
                padding: 14px 20px;
                font-size: 15px;
            }
        }
    </style>
</head>
<body>

    <!-- Barre latérale Gauche -->
    <div class="sidebar-left">
        <div>
            <button class="left-btn" onclick="ouvrirMessagerie()">💬 Messagerie</button>
            <button class="left-btn" onclick="ouvrirChatIA()">🤖 Meta IA</button>
        </div>
        
        <div class="bottom-left-group">
            <!-- Bouton + en bas à gauche pour gérer les amis -->
            <button class="add-friend-btn" title="Ajouter un ami" onclick="ouvrirGestionAmis()">✚</button>
            <button class="settings-btn" title="Paramètres" onclick="alert('Paramètres')">⚙</button>
        </div>
    </div>

    <!-- Centre de l'écran -->
    <div class="main-content">
        <input type="text" class="search-bar" placeholder="Rechercher...">

        <!-- 1. Fenêtre Amis (ouverte avec le bouton +) -->
        <div id="friends-panel" class="modal-box">
            <div class="chat-header">
                <span style="color: #1dd1a1;">👥 Mes Amis de Révision</span>
                <button class="close-btn" onclick="fermerFenetres()">✕</button>
            </div>
            <div class="friends-body">
                <div class="friends-input-zone">
                    <input type="text" id="friend-pseudo-input" placeholder="Pseudo exact de ton ami...">
                    <button class="btn-add-submit" onclick="ajouterAmi()">Ajouter</button>
                </div>
                <ul class="friends-list" id="friends-list"></ul>
            </div>
        </div>

        <!-- 2. Salon de Messagerie (filtré par amis) -->
        <div id="chat-entraide" class="modal-box">
            <div class="chat-header">
                <span style="color: #ff9f43;">💬 Salon d'entraide (Amis uniquement)</span>
                <button class="close-btn" onclick="fermerFenetres()">✕</button>
            </div>
            <div class="chat-messages" id="group-messages"></div>
            <div class="chat-input-zone">
                <input type="text" id="group-input" placeholder="Message aux amis..." onkeydown="if(event.key==='Enter') envoyerMessageGroupe()">
                <button class="btn-send" style="background-color: #ff9f43; color: #1e1e2e;" onclick="envoyerMessageGroupe()">Envoyer</button>
            </div>
        </div>

        <!-- 3. Assistant Meta IA -->
        <div id="chat-ia" class="modal-box">
            <div class="chat-header">
                <span style="color: #00d2d3;">🤖 Meta IA - Assistant</span>
                <button class="close-btn" onclick="fermerFenetres()">✕</button>
            </div>
            <div class="chat-messages" id="chat-messages">
                <div class="msg msg-ia">Salut ! Je suis ton assistant scolaire. Pose-moi une question sur tes cours !</div>
            </div>
            <div class="chat-input-zone">
                <input type="text" id="user-input" placeholder="Pose ta question ici..." onkeydown="if(event.key==='Enter') envoyerMessageIA()">
                <button class="btn-send" style="background-color: #00d2d3; color: #1e1e2e;" onclick="envoyerMessageIA()">Envoyer</button>
            </div>
        </div>

        <!-- 4. Panneau Admin -->
        <div id="admin-panel">
            <h3>Panel Admin</h3>
            <p style="font-size: 13px; color: #a4b0be; margin-top: 5px;">Code à 4 chiffres :</p>
            <input type="password" id="code-pin" maxlength="4" placeholder="••••">
            <br>
            <button style="background-color: #ff9f43; color: #1e1e2e; padding: 10px 20px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;" onclick="validerPin()">Accéder</button>
            <p id="message-pin" style="margin-top: 12px; font-weight: bold; font-size: 14px;"></p>
        </div>
    </div>

    <!-- Barre latérale Droite -->
    <div class="sidebar-right">
        <div class="top-icons">
            <div class="profile-badge" id="icone-profil" title="Profil">Moi</div>
            <button class="hamburger-btn" onclick="toggleMenuAdmin()">☰</button>
        </div>

        <div class="admin-dropdown" id="dropdown-menu">
            <button onclick="ouvrirAdmin()">Panel Admin</button>
        </div>

        <!-- Langue -->
        <button class="right-item" onclick="toggleMenu('menu-langues')" style="color: #00d2d3; font-weight: bold;">
            Langue ▾
        </button>
        <div class="sub-menu" id="menu-langues">
            <button class="sub-item" onclick="ouvrirMatiere('Anglais')">🇬🇧 Anglais</button>
            <button class="sub-item" onclick="ouvrirMatiere('Espagnol')">🇪🇸 Espagnol</button>
            <button class="sub-item" onclick="ouvrirMatiere('Français')">🇫🇷 Français</button>
            <button class="sub-item" onclick="ouvrirMatiere('Latin-Grec')">🏛️ Latin / Grec</button>
        </div>

        <!-- Science -->
        <button class="right-item" onclick="toggleMenu('menu-sciences')" style="color: #ff9f43; font-weight: bold;">
            Science ▾
        </button>
        <div class="sub-menu" id="menu-sciences">
            <button class="sub-item" onclick="ouvrirMatiere('Maths')">📐 Maths</button>
            <button class="sub-item" onclick="ouvrirMatiere('Physique-Chimie')">🧪 Physique-Chimie</button>
            <button class="sub-item" onclick="ouvrirMatiere('SVT')">🌿 SVT</button>
            <button class="sub-item" onclick="ouvrirMatiere('Technologie')">💻 Technologie</button>
        </div>

        <!-- Culture -->
        <button class="right-item" onclick="toggleMenu('menu-culture')" style="color: #1dd1a1; font-weight: bold;">
            Culture ▾
        </button>
        <div class="sub-menu" id="menu-culture">
            <button class="sub-item" onclick="ouvrirMatiere('Histoire')">📜 Histoire</button>
            <button class="sub-item" onclick="ouvrirMatiere('Géographie')">🌍 Géographie</button>
            <button class="sub-item" onclick="ouvrirMatiere('EMC')">⚖️ EMC</button>
            <button class="sub-item" onclick="ouvrirMatiere('Arts')">🎨 Arts Plastiques / Musique</button>
        </div>
    </div>

    <script>
        const CLE_API = "AQ.Ab8RN6JOyUF9wbanLDRGcIzzXnUpMzrLLYk75TLBPPHskY2VHg";

        const monPseudo = localStorage.getItem("utilisateur_pseudo") || "Moi";
        document.getElementById("icone-profil").textContent = monPseudo.slice(0, 3).toUpperCase();
        document.getElementById("icone-profil").title = monPseudo;

        function fermerFenetres() {
            document.getElementById("chat-ia").style.display = "none";
            document.getElementById("chat-entraide").style.display = "none";
            document.getElementById("friends-panel").style.display = "none";
            document.getElementById("admin-panel").style.display = "none";
        }

        /* --- GESTION DES AMIS (Bouton +) --- */
        function ouvrirGestionAmis() {
            fermerFenetres();
            document.getElementById("friends-panel").style.display = "flex";
            afficherListeAmis();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function recupererAmis() {
            return JSON.parse(localStorage.getItem("mes_amis") || "[]");
        }

        function sauvegarderAmis(amis) {
            localStorage.setItem("mes_amis", JSON.stringify(amis));
        }

        function ajouterAmi() {
            const input = document.getElementById("friend-pseudo-input");
            const ami = input.value.trim();

            if (!ami) return;
            if (ami.toLowerCase() === monPseudo.toLowerCase()) {
                alert("Tu ne peux pas t'ajouter toi-même en ami !");
                return;
            }

            let amis = recupererAmis();
            if (amis.includes(ami)) {
                alert(ami + " est déjà dans ta liste d'amis.");
                return;
            }

            amis.push(ami);
            sauvegarderAmis(amis);
            input.value = "";
            afficherListeAmis();
        }

        function supprimerAmi(index) {
            let amis = recupererAmis();
            amis.splice(index, 1);
            sauvegarderAmis(amis);
            afficherListeAmis();
        }

        function afficherListeAmis() {
            const amis = recupererAmis();
            const liste = document.getElementById("friends-list");

            if (amis.length === 0) {
                liste.innerHTML = `<li style="color: #a4b0be; font-size: 13px; text-align: center; padding: 10px;">
                    Aucun ami ajouté. Ajoute tes camarades pour pouvoir échanger !
                </li>`;
                return;
            }

            liste.innerHTML = "";
            amis.forEach((ami, index) => {
                const li = document.createElement("li");
                li.className = "friend-item";
                li.innerHTML = `
                    <span>👤 <strong>${ami}</strong></span>
                    <button class="btn-del-friend" onclick="supprimerAmi(${index})">Retirer</button>
                `;
                liste.appendChild(li);
            });
        }

        /* --- MESSAGERIE SÉCURISÉE (Amis uniquement) --- */
        function ouvrirMessagerie() {
            fermerFenetres();
            document.getElementById("chat-entraide").style.display = "flex";
            document.getElementById("group-input").focus();
            chargerMessagesGroupe();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function chargerMessagesGroupe() {
            const conteneur = document.getElementById("group-messages");
            const historique = JSON.parse(localStorage.getItem("messages_entraide") || "[]");
            const mesAmis = recupererAmis();

            // Filtrage : uniquement mes messages ET ceux provenant de mes amis
            const messagesAutorises = historique.filter(m => m.pseudo === monPseudo || mesAmis.includes(m.pseudo));

            if (mesAmis.length === 0) {
                conteneur.innerHTML = `<div class="msg msg-group-other" style="text-align: center; color: #ff9f43;">
                    ⚠️ Tu n'as aucun ami ajouté. Clique sur le bouton ✚ en bas à gauche pour ajouter un camarade, sinon personne ne pourra te lire ni te parler !
                </div>`;
                return;
            }

            if (messagesAutorises.length === 0) {
                conteneur.innerHTML = `<div class="msg msg-group-other" style="text-align: center; color: #a4b0be;">
                    Aucun message de tes amis pour l'instant. Envoie un premier mot !
                </div>`;
                return;
            }

            conteneur.innerHTML = "";
            messagesAutorises.forEach(m => {
                const estMoi = (m.pseudo === monPseudo);
                const bulle = document.createElement("div");
                bulle.className = "msg " + (estMoi ? "msg-group-me" : "msg-group-other");
                bulle.innerHTML = `
                    <div class="msg-author">${m.pseudo} <span class="msg-time">${m.heure}</span></div>
                    <div>${m.texte}</div>
                `;
                conteneur.appendChild(bulle);
            });

            conteneur.scrollTop = conteneur.scrollHeight;
        }

        function envoyerMessageGroupe() {
            const mesAmis = recupererAmis();
            if (mesAmis.length === 0) {
                alert("Ajoute au moins un ami via le bouton ✚ avant d'envoyer un message !");
                return;
            }

            const input = document.getElementById("group-input");
            const texte = input.value.trim();
            if (texte === "") return;

            const maintenant = new Date();
            const heure = maintenant.getHours().toString().padStart(2, '0') + ":" + maintenant.getMinutes().toString().padStart(2, '0');

            const historique = JSON.parse(localStorage.getItem("messages_entraide") || "[]");
            historique.push({
                pseudo: monPseudo,
                texte: texte,
                heure: heure
            });

            localStorage.setItem("messages_entraide", JSON.stringify(historique));
            input.value = "";
            chargerMessagesGroupe();
        }

        /* --- CHAT IA --- */
        function ouvrirChatIA() {
            fermerFenetres();
            document.getElementById("chat-ia").style.display = "flex";
            document.getElementById("user-input").focus();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function envoyerMessageIA() {
            const input = document.getElementById("user-input");
            const texte = input.value.trim();
            if (texte === "") return;

            const box = document.getElementById("chat-messages");

            const msgUser = document.createElement("div");
            msgUser.className = "msg msg-user";
            msgUser.textContent = texte;
            box.appendChild(msgUser);

            input.value = "";
            box.scrollTop = box.scrollHeight;

            const msgIA = document.createElement("div");
            msgIA.className = "msg msg-ia";
            msgIA.textContent = "⏳ En train d'écrire...";
            box.appendChild(msgIA);
            box.scrollTop = box.scrollHeight;

            try {
                const response = await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "x-goog-api-key": CLE_API
                    },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{ text: "Tu es un tuteur scolaire pour le site Cour-halea. Réponds clairement : " + texte }]
                        }]
                    })
                });

                const data = await response.json();

                if (data.candidates && data.candidates[0].content && data.candidates[0].content.parts[0].text) {
                    msgIA.textContent = data.candidates[0].content.parts[0].text;
                } else if (data.error) {
                    msgIA.textContent = "Erreur : " + data.error.message;
                } else {
                    msgIA.textContent = "Désolé, aucune réponse reçue.";
                }
            } catch (err) {
                msgIA.textContent = "Erreur de connexion.";
            }

            box.scrollTop = box.scrollHeight;
        }

        /* --- MENUS --- */
        function toggleMenu(idMenu) {
            const menu = document.getElementById(idMenu);
            const estOuvert = (menu.style.display === "block");
            document.querySelectorAll(".sub-menu").forEach(m => m.style.display = "none");
            menu.style.display = estOuvert ? "none" : "block";
        }

        function ouvrirMatiere(matiere) {
            window.location.href = `cours.html?matiere=${encodeURIComponent(matiere)}`;
        }

        function toggleMenuAdmin() {
            const menu = document.getElementById("dropdown-menu");
            menu.style.display = (menu.style.display === "block") ? "none" : "block";
        }

        function ouvrirAdmin() {
            fermerFenetres();
            document.getElementById("dropdown-menu").style.display = "none";
            document.getElementById("admin-panel").style.display = "block";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function validerPin() {
            const code = document.getElementById("code-pin").value;
            const reponse = document.getElementById("message-pin");
            if (code === "1234") {
                reponse.style.color = "#1dd1a1";
                reponse.innerHTML = "✅ Connecté en administrateur !";
            } else {
                reponse.style.color = "#ee5253";
                reponse.innerHTML = "❌ Code faux !";
            }
        }
    </script>
