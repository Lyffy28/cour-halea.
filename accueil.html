<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cour-halea - Accueil</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #1e1e2e;
            color: #ffffff;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* 1. Colonne gauche (PC) */
        .sidebar-left {
            width: 90px;
            background-color: #26273b;
            border-right: 1px solid #3d3f58;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .left-btn {
            background: none;
            border: none;
            border-bottom: 1px solid #3d3f58;
            color: #c8d6e5;
            padding: 25px 5px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            width: 100%;
            transition: 0.2s;
        }

        .left-btn:hover {
            background-color: #343650;
            color: #00d2d3;
        }

        .settings-btn {
            background: none;
            border: none;
            border-top: 1px solid #3d3f58;
            color: #c8d6e5;
            padding: 20px 0;
            font-size: 24px;
            cursor: pointer;
            text-align: center;
            width: 100%;
        }

        /* 2. Centre */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-y: auto;
        }

        .search-bar {
            width: 90%;
            max-width: 550px;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 25px;
            border: 1px solid #484b6a;
            background-color: #2b2c40;
            color: #ffffff;
            outline: none;
        }

        .search-bar:focus {
            border-color: #00d2d3;
        }

        /* Fenêtre Admin */
        #admin-panel {
            display: none;
            background-color: #2b2c40;
            margin-top: 25px;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #ff9f43;
            text-align: center;
            width: 100%;
            max-width: 320px;
        }

        #admin-panel input {
            padding: 10px;
            font-size: 18px;
            width: 120px;
            text-align: center;
            border-radius: 6px;
            border: 1px solid #484b6a;
            background-color: #1e1e2e;
            color: #ffffff;
            letter-spacing: 4px;
            margin: 15px 0;
            outline: none;
        }

        .btn-admin {
            background-color: #ff9f43;
            color: #1e1e2e;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
            font-weight: bold;
        }

        /* Fenêtre Chat Meta IA */
        #chat-ia {
            display: none;
            flex-direction: column;
            width: 100%;
            max-width: 650px;
            height: 480px;
            background-color: #26273b;
            border: 1px solid #00d2d3;
            border-radius: 12px;
            margin-top: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        .chat-header {
            background-color: #1e1e2e;
            padding: 12px 16px;
            font-weight: bold;
            color: #00d2d3;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #3d3f58;
        }

        .close-chat-btn {
            background: none;
            border: none;
            color: #a4b0be;
            font-size: 20px;
            cursor: pointer;
        }

        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .msg {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.4;
            white-space: pre-wrap;
        }

        .msg-ia {
            background-color: #343650;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            color: #ffffff;
        }

        .msg-user {
            background-color: #00d2d3;
            color: #1e1e2e;
            font-weight: 500;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .chat-input-zone {
            display: flex;
            border-top: 1px solid #3d3f58;
            background-color: #1e1e2e;
            padding: 10px;
            gap: 10px;
        }

        .chat-input-zone input {
            flex: 1;
            background-color: #26273b;
            border: 1px solid #3d3f58;
            padding: 10px 14px;
            color: #ffffff;
            border-radius: 20px;
            outline: none;
            font-size: 14px;
        }

        .chat-input-zone button {
            background-color: #00d2d3;
            color: #1e1e2e;
            border: none;
            font-weight: bold;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
        }

        /* 3. Colonne droite (PC) */
        .sidebar-right {
            width: 170px;
            background-color: #26273b;
            border-left: 1px solid #3d3f58;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .top-icons {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 12px 5px;
            border-bottom: 1px solid #3d3f58;
        }

        .profile-badge {
            background-color: #00d2d3;
            color: #1e1e2e;
            border-radius: 50%;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
        }

        .hamburger-btn {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 24px;
            cursor: pointer;
        }

        .admin-dropdown {
            display: none;
            background-color: #1e1e2e;
            border-bottom: 1px solid #3d3f58;
            padding: 10px;
            text-align: center;
        }

        .admin-dropdown button {
            background-color: #ff9f43;
            color: #1e1e2e;
            border: none;
            border-radius: 4px;
            padding: 8px;
            font-size: 13px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
        }

        .right-item {
            padding: 16px 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid #3d3f58;
            font-size: 15px;
            cursor: pointer;
            color: #c8d6e5;
            background: none;
            border-left: none;
            border-right: none;
            border-top: none;
            width: 100%;
            transition: 0.2s;
        }

        .right-item:hover {
            background-color: #343650;
            color: #ffffff;
        }

        .sub-menu {
            display: none;
            background-color: #1e1e2e;
            border-bottom: 1px solid #3d3f58;
        }

        .sub-item {
            display: block;
            width: 100%;
            padding: 12px 15px;
            background: none;
            border: none;
            border-bottom: 1px solid #2d2f44;
            color: #00d2d3;
            font-size: 14px;
            text-align: left;
            cursor: pointer;
            transition: 0.2s;
        }

        .sub-item:hover {
            background-color: #2b2c40;
            padding-left: 20px;
        }

        .add-btn {
            font-size: 24px;
            color: #00d2d3;
            margin-top: auto;
        }

        /* =============================================
           📱 ADAPTATION SPECIALE POUR TELEPHONE (RESPONSIVE)
           ============================================= */
        @media (max-width: 768px) {
            body {
                flex-direction: column;
                height: auto;
                min-height: 100vh;
                overflow-y: auto;
            }

            /* La colonne gauche devient une barre en haut */
            .sidebar-left {
                width: 100%;
                height: auto;
                flex-direction: row;
                border-right: none;
                border-bottom: 1px solid #3d3f58;
                order: 1;
            }

            .sidebar-left div {
                display: flex;
                flex: 1;
            }

            .left-btn {
                writing-mode: horizontal-tb;
                transform: none;
                padding: 12px 10px;
                border-bottom: none;
                border-right: 1px solid #3d3f58;
                font-size: 14px;
                flex: 1;
            }

            .settings-btn {
                width: 60px;
                padding: 10px 0;
                border-top: none;
                border-left: 1px solid #3d3f58;
            }

            /* Le centre prend toute la place au milieu */
            .main-content {
                order: 2;
                padding: 15px 10px;
                min-height: calc(100vh - 280px);
            }

            .search-bar {
                width: 95%;
            }

            #chat-ia {
                height: 420px;
            }

            /* La colonne droite passe sous le contenu */
            .sidebar-right {
                width: 100%;
                height: auto;
                border-left: none;
                border-top: 2px solid #00d2d3;
                order: 3;
            }

            .right-item {
                padding: 14px;
                font-size: 16px;
            }

            .sub-item {
                padding: 14px 20px;
                font-size: 15px;
            }

            .add-btn {
                margin-top: 0;
                padding: 15px 0;
            }
        }
    </style>
</head>
<body>

    <!-- Barre latérale Gauche (Barre du haut sur mobile) -->
    <div class="sidebar-left">
        <div>
            <button class="left-btn" onclick="alert('Ouverture de Notebook')">Notebook</button>
            <button class="left-btn" onclick="ouvrirChatIA()">Meta IA 🤖</button>
        </div>
        <button class="settings-btn" title="Paramètres" onclick="alert('Paramètres')">⚙</button>
    </div>

    <!-- Centre de l'écran -->
    <div class="main-content">
        <input type="text" class="search-bar" placeholder="Rechercher...">

        <!-- Chat Meta IA -->
        <div id="chat-ia">
            <div class="chat-header">
                <span>🤖 Meta IA - Assistant</span>
                <button class="close-chat-btn" onclick="fermerChatIA()">✕</button>
            </div>
            <div class="chat-messages" id="chat-messages">
                <div class="msg msg-ia">Salut ! Je suis ton assistant scolaire. Pose-moi une question sur tes cours ou tes devoirs !</div>
            </div>
            <div class="chat-input-zone">
                <input type="text" id="user-input" placeholder="Pose ta question ici..." onkeydown="siToucheEntree(event)">
                <button onclick="envoyerMessage()">Envoyer</button>
            </div>
        </div>

        <!-- Panneau Admin -->
        <div id="admin-panel">
            <h3>Panel Admin</h3>
            <p style="font-size: 13px; color: #a4b0be; margin-top: 5px;">Code à 4 chiffres :</p>
            <input type="password" id="code-pin" maxlength="4" placeholder="••••">
            <br>
            <button class="btn-admin" onclick="validerPin()">Accéder</button>
            <p id="message-pin" style="margin-top: 12px; font-weight: bold; font-size: 14px;"></p>
        </div>
    </div>

    <!-- Barre latérale Droite (Matières en bas sur mobile) -->
    <div class="sidebar-right">
        <div class="top-icons">
            <div class="profile-badge" id="icone-profil" title="Profil">Moi</div>
            <button class="hamburger-btn" onclick="toggleMenuAdmin()">☰</button>
        </div>

        <div class="admin-dropdown" id="dropdown-menu">
            <button onclick="ouvrirAdmin()">Panel Admin</button>
        </div>

        <!-- Langue -->
        <button class="right-item" onclick="toggleLangues()" style="color: #00d2d3; font-weight: bold;">
            Langue ▾
        </button>
        <div class="sub-menu" id="menu-langues">
            <button class="sub-item" onclick="ouvrirMatiere('Anglais')">🇬🇧 Anglais</button>
            <button class="sub-item" onclick="ouvrirMatiere('Espagnol')">🇪🇸 Espagnol</button>
            <button class="sub-item" onclick="ouvrirMatiere('Français')">🇫🇷 Français</button>
            <button class="sub-item" onclick="ouvrirMatiere('Latin-Grec')">🏛️ Latin / Grec</button>
        </div>

        <button class="right-item" onclick="ouvrirMatiere('Science')">Science</button>
        <button class="right-item" onclick="ouvrirMatiere('Culture')">Culture</button>
        <button class="right-item add-btn" title="Ajouter un cours" onclick="alert('Ajouter un nouveau cours')">✚</button>
    </div>

    <script>
        const CLE_API = "AQ.Ab8RN6JOyUF9wbanLDRGcIzzXnUpMzrLLYk75TLBPPHskY2VHg";

        // Pseudo
        const pseudo = localStorage.getItem("utilisateur_pseudo");
        if (pseudo) {
            document.getElementById("icone-profil").textContent = pseudo.slice(0, 3).toUpperCase();
            document.getElementById("icone-profil").title = pseudo;
        }

        function toggleLangues() {
            const sm = document.getElementById("menu-langues");
            sm.style.display = (sm.style.display === "block") ? "none" : "block";
        }

        function ouvrirMatiere(matiere) {
            window.location.href = `cours.html?matiere=${encodeURIComponent(matiere)}`;
        }

        function toggleMenuAdmin() {
            const menu = document.getElementById("dropdown-menu");
            menu.style.display = (menu.style.display === "block") ? "none" : "block";
        }

        function ouvrirAdmin() {
            fermerChatIA();
            document.getElementById("dropdown-menu").style.display = "none";
            document.getElementById("admin-panel").style.display = "block";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function validerPin() {
            const code = document.getElementById("code-pin").value;
            const reponse = document.getElementById("message-pin");
            if (code === "1234") {
                reponse.style.color = "#1dd1a1";
                reponse.innerHTML = "✅ Connecté en administrateur !";
            } else {
                reponse.style.color = "#ee5253";
                reponse.innerHTML = "❌ Code faux !";
            }
        }

        function ouvrirChatIA() {
            document.getElementById("admin-panel").style.display = "none";
            document.getElementById("chat-ia").style.display = "flex";
            document.getElementById("user-input").focus();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function fermerChatIA() {
            document.getElementById("chat-ia").style.display = "none";
        }

        function siToucheEntree(event) {
            if (event.key === "Enter") {
                envoyerMessage();
            }
        }

        async function envoyerMessage() {
            const input = document.getElementById("user-input");
            const texte = input.value.trim();
            if (texte === "") return;

            const box = document.getElementById("chat-messages");

            const msgUser = document.createElement("div");
            msgUser.className = "msg msg-user";
            msgUser.textContent = texte;
            box.appendChild(msgUser);

            input.value = "";
            box.scrollTop = box.scrollHeight;

            const msgIA = document.createElement("div");
            msgIA.className = "msg msg-ia";
            msgIA.textContent = "⏳ En train d'écrire...";
            box.appendChild(msgIA);
            box.scrollTop = box.scrollHeight;

            try {
                const response = await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "x-goog-api-key": CLE_API
                    },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{ text: "Tu es un tuteur scolaire pour le site Cour-halea. Réponds clairement et précisément : " + texte }]
                        }]
                    })
                });

                const data = await response.json();

                if (data.candidates && data.candidates[0].content && data.candidates[0].content.parts[0].text) {
                    msgIA.textContent = data.candidates[0].content.parts[0].text;
                } else if (data.error) {
                    msgIA.textContent = "Erreur : " + data.error.message;
                } else {
                    msgIA.textContent = "Désolé, aucune réponse reçue.";
                }
            } catch (err) {
                msgIA.textContent = "Erreur de connexion. Vérifie ta connexion internet.";
            }

            box.scrollTop = box.scrollHeight;
        }
    </script>

</body>
</html>
